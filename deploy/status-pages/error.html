<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- Reloads by itself, so the site reappears as soon as it is back. -->
    <meta http-equiv="refresh" content="30" />
    <title>Temporarily unavailable · Last.fm Scrobbler for YouTube Music</title>
    <style>
      :root {
        --bg: #f9fafb;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --card: #111827;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --border: #1f2937;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 480px;
        padding: 32px 28px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
      h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.01em; }
      p { margin: 8px 0; color: var(--muted); }
      p strong { color: var(--text); }
      .small { margin-top: 20px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge"><span class="dot"></span>Temporarily unavailable</span>
      <h1>Something went wrong on our side</h1>
      <p>
        Last.fm Scrobbler for YouTube Music isn't responding right now. This
        isn't planned maintenance.
      </p>
      <p>
        Your account and settings are not affected. Please try again in a
        few minutes.
      </p>
      <p class="small">This page refreshes by itself every 30 seconds.</p>
    </main>
  </body>
</html>
