# Pages nginx shows when the web app does not answer.
#
# Installed on the server as /etc/nginx/snippets/scrobbler-status.conf and
# included from the scrobbler.bocono-labs.com server block. It only applies
# to errors nginx itself produces (the app is stopped or not answering); the
# app's own error responses pass through untouched.
#
# /var/www/scrobbler-status/ holds maintenance.html and error.html, copied
# there by the deploy workflow. During a deploy the workflow also creates
# maintenance.on.html; while that file exists it wins, otherwise error.html
# is shown.

error_page 502 503 504 =503 /__status_page;

location = /__status_page {
    internal;
    root /var/www/scrobbler-status;
    # Every entry but the last is served from this location; the last one is
    # the fallback when neither page is installed.
    try_files /maintenance.on.html /error.html =503;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
}
