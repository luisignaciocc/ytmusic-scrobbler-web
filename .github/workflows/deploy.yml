name: Deploy to Server

on:
  push:
    branches:
      - master
    paths:
      - "apps/worker/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "schema.prisma"
      - "migrations/**"
      - "scripts/deploy/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-deploy-worker: ${{ steps.changes.outputs.should-deploy-worker }}
      should-deploy-web: ${{ steps.changes.outputs.should-deploy-web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
            echo "Changed files: $CHANGED_FILES"
            
            # Check worker changes
            if echo "$CHANGED_FILES" | grep -E "(^apps/worker/|^packages/|^pnpm-lock\.yaml$|^package\.json$|^schema\.prisma$|^migrations/|^scripts/deploy/|^\.github/workflows/deploy\.yml$)"; then
              echo "should-deploy-worker=true" >> $GITHUB_OUTPUT
              echo "Worker changes detected"
            else
              echo "should-deploy-worker=false" >> $GITHUB_OUTPUT
              echo "No worker changes detected"
            fi
            
            # Check web changes
            if echo "$CHANGED_FILES" | grep -E "(^apps/web/|^packages/|^pnpm-lock\.yaml$|^package\.json$|^scripts/deploy/|^deploy/|^\.github/workflows/deploy\.yml$)"; then
              echo "should-deploy-web=true" >> $GITHUB_OUTPUT
              echo "Web changes detected"
            else
              echo "should-deploy-web=false" >> $GITHUB_OUTPUT
              echo "No web changes detected"
            fi
          else
            echo "should-deploy-worker=true" >> $GITHUB_OUTPUT
            echo "should-deploy-web=true" >> $GITHUB_OUTPUT
          fi

  # The apps are built here, on the runner, and only the finished builds go to
  # the server: it has 1 GB of RAM, and building there meant stopping the site
  # for the 15 to 20 minutes the build took. See scripts/deploy/server-deploy.sh
  # for the server side.
  build-and-deploy:
    needs: check-changes
    if: |
      needs.check-changes.outputs.should-deploy-worker == 'true' ||
      needs.check-changes.outputs.should-deploy-web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOULD_DEPLOY_WORKER: ${{ needs.check-changes.outputs.should-deploy-worker }}
      SHOULD_DEPLOY_WEB: ${{ needs.check-changes.outputs.should-deploy-web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Next.js build cache
        if: env.SHOULD_DEPLOY_WEB == 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm generate

      # No secrets and no database here, on purpose: nothing in the build may
      # depend on them. Values the app needs are read at run time from the
      # server's .env.
      - name: Build web app
        if: env.SHOULD_DEPLOY_WEB == 'true'
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          pnpm build --filter web
          test -f apps/web/.next/BUILD_ID
          tar -czf web.tgz -C apps/web --exclude=.next/cache .next
          ls -lh web.tgz

      # `nest build` directly: the package's own build script first applies
      # database migrations, which only the server can do.
      - name: Build worker
        if: env.SHOULD_DEPLOY_WORKER == 'true'
        run: |
          pnpm --filter worker exec nest build
          test -f apps/worker/dist/main.js
          tar -czf worker.tgz -C apps/worker dist
          ls -lh worker.tgz

      - name: Copy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Upload builds to the server
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          ssh $REMOTE_USER@$REMOTE_HOST 'mkdir -p ~/deploy-incoming && rm -f ~/deploy-incoming/*.tgz'
          for build in web.tgz worker.tgz; do
            if [ -f "$build" ]; then
              scp "$build" $REMOTE_USER@$REMOTE_HOST:deploy-incoming/
            fi
          done

      - name: Install the builds and restart
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          ssh $REMOTE_USER@$REMOTE_HOST 'bash -s' -- \
            "${{ github.sha }}" "$SHOULD_DEPLOY_WEB" "$SHOULD_DEPLOY_WORKER" \
            < scripts/deploy/server-deploy.sh

      # What a visitor, Stripe and Paddle get, through nginx and TLS. The
      # server script already checked the app locally and rolled back if it
      # was broken; a failure here means the app is fine but unreachable or
      # misconfigured from outside, which no rollback would fix.
      - name: Smoke test from outside
        env:
          SKIP_ADMIN: "1"
        run: |
          bash scripts/monitor/external-check.sh | tee smoke.txt
          if grep -q '^FAIL' smoke.txt; then
            echo "::error::The deploy finished but the site fails from outside: $(grep -c '^FAIL' smoke.txt) check(s)"
            exit 1
          fi
